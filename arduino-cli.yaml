# arduino-cli config for the Kamaz-Leveler project.
# Points the sketchbook (and therefore the libraries directory) at C:/my so
# the firmware resolves libraries from C:/my/libraries.
#
# Usage:
#   arduino-cli compile --config-file arduino-cli.yaml \
#     -b esp32:esp32:esp32 --warnings none kamaz_8_5_9_fr_adafruiti_OTA_NM
board_manager:
  additional_urls:
    - https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

directories:
  user: C:/my

library:
  enable_unsafe_install: true