name: firmware-build

# Mirrors build.cmd: same sketch, FQBN, partition scheme and linker flag.
# Libraries are pinned in .github/arduino-libraries.txt; GEM is vendored in ci/libraries
# because the local copy is newer than the released 1.8.1.
on:
  push:
    branches: [main, 'refactor/**']
    paths:
      - 'kamaz_10_16_8_fr_adafruiti_OTA_NM/**'
      - '.github/**'
      - 'ci/**'
  pull_request:
    paths:
      - 'kamaz_10_16_8_fr_adafruiti_OTA_NM/**'
      - '.github/**'
      - 'ci/**'
  workflow_dispatch:

env:
  SKETCH: kamaz_10_16_8_fr_adafruiti_OTA_NM
  FQBN: esp32:esp32:esp32:PartitionScheme=custom,FlashSize=4M
  ESP32_CORE_VERSION: 3.3.11
  ARDUINO_CLI_VERSION: 1.5.1

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      - name: Install libraries
        run: |
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            echo "::group::install $line"
            arduino-cli lib install "$line"
            echo "::endgroup::"
          done < .github/arduino-libraries.txt

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings none \
            --libraries "$GITHUB_WORKSPACE/ci/libraries" \
            --build-path "$RUNNER_TEMP/build" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--allow-multiple-definition" \
            "$SKETCH"
