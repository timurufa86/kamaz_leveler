# Kamaz Leveler — пакет для Home Assistant (HTTP REST, прошивка 10.16.0+)
#
# 1. /config/packages/kamaz_leveler.yaml
# 2. configuration.yaml:  homeassistant: packages: !include_dir_named packages
# 3. IP устройства: 192.168.0.204 (статический, прошивка 10.16.3+)
# 4. Токен: в secrets.yaml  kamaz_token: "<токен>"  (задаётся на устройстве: HA TOKEN <стр>)

rest:
  - resource: "http://192.168.0.204/api/state"
    scan_interval: 5
    headers:
      X-Api-Key: !secret kamaz_token
    sensor:
      - name: "Kamaz mode"
        value_template: "{{ value_json.mode }}"
        icon: mdi:car-cruise-control
      - name: "Kamaz state"
        value_template: "{{ value_json.state }}"
      - name: "Kamaz angle X"
        unit_of_measurement: "°"
        value_template: "{{ value_json.angles.x | round(2) }}"
      - name: "Kamaz angle Y"
        unit_of_measurement: "°"
        value_template: "{{ value_json.angles.y | round(2) }}"
      - name: "Kamaz temperature"
        unit_of_measurement: "°C"
        value_template: "{{ value_json.temperature_c | round(1) }}"
        device_class: temperature
      - name: "Kamaz pressure FL"
        unit_of_measurement: "bar"
        value_template: "{{ value_json.pressure.fl | round(2) }}"
      - name: "Kamaz pressure FR"
        unit_of_measurement: "bar"
        value_template: "{{ value_json.pressure.fr | round(2) }}"
      - name: "Kamaz pressure RL"
        unit_of_measurement: "bar"
        value_template: "{{ value_json.pressure.rl | round(2) }}"
      - name: "Kamaz pressure RR"
        unit_of_measurement: "bar"
        value_template: "{{ value_json.pressure.rr | round(2) }}"
      - name: "Kamaz pressure master"
        unit_of_measurement: "bar"
        value_template: "{{ value_json.pressure.master | round(2) }}"
      - name: "Kamaz leveling stage"
        value_template: "{{ value_json.leveling.stage }}"
      - name: "Kamaz errors"
        value_template: "{{ value_json.errors.count }}"
      - name: "Kamaz heap free"
        unit_of_measurement: "B"
        value_template: "{{ value_json.system.heap_free }}"
      - name: "Kamaz WiFi RSSI"
        unit_of_measurement: "dBm"
        value_template: "{{ value_json.wifi.rssi }}"
        device_class: signal_strength
      - name: "Kamaz uptime"
        unit_of_measurement: "s"
        value_template: "{{ value_json.uptime_s }}"
      - name: "Kamaz test state"
        value_template: "{{ value_json.test_state }}"
    binary_sensor:
      - name: "Kamaz moving"
        value_template: "{{ value_json.moving }}"
      - name: "Kamaz MPU ok"
        value_template: "{{ value_json.mpu_ok }}"
        device_class: connectivity
      - name: "Kamaz OTA in progress"
        value_template: "{{ value_json.ota.in_progress }}"
        device_class: running

  - resource: "http://192.168.0.204/api/config"
    scan_interval: 60
    headers:
      X-Api-Key: !secret kamaz_token
    sensor:
      - name: "Kamaz config"
        value_template: "v{{ value_json.formatVersion }}"
        json_attributes:
          - pressureMin
          - pressureMax
          - masterLowBar
          - tiltThresholdX
          - tiltThresholdY
          - nivCount
          - timeInterval
          - inflateDelay
          - releaseDelay
          - manualMaxTimeSec
          - masterCheckSec
          - pressureDeadband
          - pressureStabilizeMs
          - pressureIdleMin
          - coarseZoneRatio
          - fineZoneRatio
          - worseningRatio
          - stableThresholdDeg
          - movementEnabled
          - movementPressureFront
          - movementPressureRear
          - movementDurationSec
          - movementSettleSec
          - movementCheckSec
          - movementTolerance
          - parkingPressureBar
          - gyroThreshold
          - gyroBumpThreshold
          - accelThreshold
          - imuMotionDet
          - backlightOffMin
          - frameMs
          - redrawAngleThr
          - redrawPressureThr
          - haEnabled
          - staStatic
          - staIp
          - staGw
          - staMask
          - staDns

# ── Хелперы для всплывающей панели настроек ──
input_boolean:
  kamaz_settings_open:
    name: "Kamaz: настройки открыты"
    icon: mdi:cog

input_number:
  kamaz_pressure_min:
    name: "Kamaz P min, бар"
    min: 0.1
    max: 5
    step: 0.1
    initial: 1.0
  kamaz_pressure_max:
    name: "Kamaz P max, бар"
    min: 1
    max: 8
    step: 0.1
    initial: 7.0
  kamaz_tilt_x:
    name: "Kamaz наклон X, °"
    min: 0
    max: 5
    step: 0.1
    initial: 0.5
  kamaz_tilt_y:
    name: "Kamaz наклон Y, °"
    min: 0
    max: 5
    step: 0.1
    initial: 0.5
  kamaz_niv_count:
    name: "Kamaz попыток/час"
    min: 1
    max: 20
    step: 1
    initial: 5
  kamaz_interval_min:
    name: "Kamaz интервал, мин"
    min: 1
    max: 60
    step: 1
    initial: 5
  kamaz_inflate_sec:
    name: "Kamaz накачка, с"
    min: 1
    max: 10
    step: 1
    initial: 4
  kamaz_release_sec:
    name: "Kamaz сброс, с"
    min: 1
    max: 10
    step: 1
    initial: 7
  kamaz_manual_max_sec:
    name: "Kamaz ручное макс, с"
    min: 1
    max: 30
    step: 1
    initial: 10
  kamaz_deadband:
    name: "Kamaz мёртвая зона, бар"
    min: 0.05
    max: 0.5
    step: 0.05
    initial: 0.2
  kamaz_pulse_sec:
    name: "Kamaz импульс, с"
    min: 0.2
    max: 10
    step: 0.2
    initial: 2.0

# ── Команды ──
rest_command:
  kamaz_set_auto:
    url: "http://192.168.0.204/api/mode"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"mode":"auto"}'

  kamaz_set_manual:
    url: "http://192.168.0.204/api/mode"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"mode":"manual"}'

  kamaz_manual_start:
    url: "http://192.168.0.204/api/manual"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"start","pad":"{{ pad }}","inflate":{{ inflate }}}'

  kamaz_manual_stop:
    url: "http://192.168.0.204/api/manual"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"stop"}'

  kamaz_pulse:
    url: "http://192.168.0.204/api/manual"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"pulse","pad":"{{ pad }}","inflate":{{ inflate }},"seconds":{{ seconds | default(2) }}}'

  kamaz_stop_all:
    url: "http://192.168.0.204/api/action"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"stop_all"}'

  kamaz_reset_errors:
    url: "http://192.168.0.204/api/action"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"reset_errors"}'

  kamaz_save_config:
    url: "http://192.168.0.204/api/action"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: '{"action":"save"}'

  kamaz_apply_settings:
    url: "http://192.168.0.204/api/config"
    method: POST
    headers:
      X-Api-Key: !secret kamaz_token
    content_type: "application/json"
    payload: >-
      {"pressureMin": {{ states('input_number.kamaz_pressure_min') | float }},
      "pressureMax": {{ states('input_number.kamaz_pressure_max') | float }},
      "tiltThresholdX": {{ states('input_number.kamaz_tilt_x') | float }},
      "tiltThresholdY": {{ states('input_number.kamaz_tilt_y') | float }},
      "nivCount": {{ states('input_number.kamaz_niv_count') | int }},
      "timeInterval": {{ states('input_number.kamaz_interval_min') | int }},
      "inflateDelay": {{ states('input_number.kamaz_inflate_sec') | int }},
      "releaseDelay": {{ states('input_number.kamaz_release_sec') | int }},
      "manualMaxTimeSec": {{ states('input_number.kamaz_manual_max_sec') | int }},
      "pressureDeadband": {{ states('input_number.kamaz_deadband') | float }}}

# Скрипты намеренно НЕ определены здесь: в configuration.yaml уже есть
#   script: !include scripts.yaml
# и пакет с собственным `script:` даёт конфликт домена.
